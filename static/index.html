<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="MEDI-LINK: Right Care. Right Doctor. Right Place. Right Time. Unified Healthcare Platform connecting patients, hospitals, clinics, RMP doctors, Ayurvedic practitioners, and pharmacies." />
  <title>MEDI-LINK &mdash; Right Care. Right Doctor. Right Place. Right Time.</title>
  
  <!-- Favicon using official Medi-Link logo -->
  <link rel="icon" type="image/jpeg" href="/static/assets/logo.jpg" />

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            },
            tealcare: {
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
            },
            ayur: {
              50: '#f0fdf4',
              600: '#16a34a',
              700: '#15803d',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Custom App & Accessibility Styles -->
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased selection:bg-sky-500 selection:text-white">
  
  <!-- Root SPA Container -->
  <div id="app" class="flex flex-col min-h-screen"></div>

  <!-- Main ES Module Script -->
  <script type="module">
    import { Router } from "./static/js/router.js";
    Router.init();
  </script>
</body>
</html>
